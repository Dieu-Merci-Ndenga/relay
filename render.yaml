databases:
  - name: relay-postgres
    databaseName: relay
    user: relay
    plan: free

services:
  - type: redis
    name: relay-redis
    plan: free
    ipAllowList: []

  - type: web
    name: relay-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: relay-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: relay-redis
          property: connectionString
      - key: WEBHOOK_SECRET
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DELIVERY_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: relay-dashboard
    runtime: static
    buildCommand: echo "Static frontend ready"
    staticPublishPath: ./frontend

  - type: web
    name: relay-receiver
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run demo:receiver
    healthCheckPath: /status